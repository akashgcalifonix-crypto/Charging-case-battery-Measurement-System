<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CALIFONIX QC - Production Line</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0d14; --surface: #111827; --border: #1e2d45; --accent: #00d4ff;
    --green-ui: #00ff88; --red-ui: #ff3d6b; --yellow: #ffc947; --text: #e2e8f0;
    --pass-bg: #1b5e20; --fail-bg: #b71c1c; 
  }

  body { 
    background: var(--bg); color: var(--text); font-family: 'Exo 2', sans-serif; 
    margin: 0; padding: 20px; transition: background 0.3s ease; overflow-x: hidden;
  }

  body.status-pass { background-color: var(--pass-bg); }
  body.status-fail { background-color: var(--fail-bg); }

  .container { max-width: 1200px; margin: 0 auto; position: relative; }

  header { 
    display: flex; align-items: center; justify-content: space-between; 
    padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 20px;
  }

  .main-display {
    display: grid; grid-template-columns: 350px 1fr; gap: 20px; margin-bottom: 20px;
  }

  .control-panel { background: var(--surface); border: 2px solid var(--border); border-radius: 15px; padding: 25px; }
  .btn-main { 
    width: 100%; padding: 15px; border-radius: 10px; border: none; 
    font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-bottom: 15px;
    text-transform: uppercase; font-family: 'Share Tech Mono', monospace;
  }
  .btn-connect { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
  .btn-scan { background: var(--accent); color: #000; }
  .btn-scan:disabled { opacity: 0.3; }

  input { 
    width: 100%; background: #000; border: 2px solid var(--border); border-radius: 10px; 
    padding: 15px; color: #fff; font-size: 1.2rem; font-family: 'Share Tech Mono', monospace;
    margin-bottom: 20px; box-sizing: border-box; text-align: center;
  }

  /* Large Result Area */
  .result-panel { 
    background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); 
    border-radius: 15px; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; text-align: center; padding: 40px;
    min-height: 450px;
  }

  .big-current { font-size: 7rem; font-weight: 800; line-height: 1; margin: 0; font-family: 'Share Tech Mono', monospace;}
  .big-battery { font-size: 4rem; font-weight: 800; color: #fff; margin-bottom: 10px; font-family: 'Share Tech Mono', monospace;}
  .big-status-text { font-size: 5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 5px; margin-top: 10px;}
  
  .small-label { font-size: 1rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; }

  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
  .sum-card { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--border); }
  .sum-val { font-size: 1.8rem; font-weight: 800; font-family: 'Share Tech Mono', monospace; }
  .sum-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }

  .history-card { background: var(--surface); border-radius: 15px; padding: 20px; }
  table { width: 100%; border-collapse: collapse; font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; }
  th { text-align: left; opacity: 0.6; padding: 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

  .tag { padding: 4px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
  .tag-pass { background: #2e7d32; color: white; }
  .tag-fail { background: #c62828; color: white; }
</style>
</head>
<body id="body">

<div class="container">
  <header>
    <div style="font-weight: 800; font-size: 1.4rem;">CALIFONIX <span style="font-weight: 400; color: var(--accent);">QC TESTER</span></div>
    <div id="usbStatus" style="color: var(--red-ui); font-weight: bold;">● DISCONNECTED</div>
  </header>

  <div class="summary-bar">
    <div class="sum-card" style="border-color: var(--accent)"><div class="sum-val" id="sumTotal">0</div><div class="sum-lbl">TOTAL SCANNED</div></div>
    <div class="sum-card" style="border-color: var(--green-ui)"><div class="sum-val" id="sumPass">0</div><div class="sum-lbl">PASS</div></div>
    <div class="sum-card" style="border-color: var(--red-ui)"><div class="sum-val" id="sumFail">0</div><div class="sum-lbl">FAIL</div></div>
    <div class="sum-card" style="border-color: var(--yellow)"><div class="sum-val" id="sumYield">0%</div><div class="sum-lbl">YIELD</div></div>
  </div>

  <div class="main-display">
    <div class="control-panel">
      <button class="btn-main btn-connect" id="connBtn" onclick="connect()">Connect USB</button>
      <div style="margin-top: 20px;">
        <label style="font-size: 0.8rem; opacity: 0.7;">BARCODE / SERIAL NO.</label>
        <input type="text" id="snInput" placeholder="READY" disabled onkeydown="if(event.key==='Enter') startScan()">
        <button class="btn-main btn-scan" id="scanBtn" onclick="startScan()" disabled>Test Unit</button>
      </div>
      <div id="log" style="font-size: 0.8rem; color: var(--yellow); font-family: 'Share Tech Mono';">Please connect ESP32...</div>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="small-label" id="topLabel">Awaiting Device</div>
      
      <!-- Current Display -->
      <div class="big-current" id="mainVal">—</div>
      <div class="small-label" style="margin-bottom: 20px;">CURRENT (mA)</div>
      
      <!-- Battery Display -->
      <div class="big-battery" id="batVal">—</div>
      <div class="small-label">BATTERY CAPACITY (%)</div>

      <!-- Status Display -->
      <div class="big-status-text" id="statusText">READY</div>
      <div class="small-label" id="bottomLabel" style="margin-top: 20px;">SYSTEM READY</div>
    </div>
  </div>

  <div class="history-card">
    <table>
      <thead><tr><th>TIME</th><th>SERIAL NO.</th><th>BATTERY %</th><th>CURRENT (mA)</th><th>STATUS</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
// --- CONFIGURATION ---
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw9r3dhN8fGufEjy1vel7gP428U3yATVlPMq0wmPIhYXC7kyoqMxqNVF8RBk2wbkvJvaQ/exec"; 

let port, writer, reader, history = [];

async function connect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    document.getElementById('usbStatus').textContent = "● ESP32 CONNECTED";
    document.getElementById('usbStatus').style.color = "var(--green-ui)";
    document.getElementById('snInput').disabled = false;
    document.getElementById('scanBtn').disabled = false;
    document.getElementById('snInput').focus();
    document.getElementById('log').textContent = "Ready for scanning.";
    readLoop();
  } catch(e) { console.error(e); }
}

async function readLoop() {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  reader = decoder.readable.getReader();
  let buffer = "";
  while(true) {
    const {value, done} = await reader.read();
    if(done) break;
    buffer += value;
    let parts = buffer.split("\n");
    buffer = parts.pop();
    for(let line of parts) {
      try {
        let msg = JSON.parse(line);
        if(msg.status === 'result') finalize(msg);
        if(msg.status === 'measuring') {
            document.getElementById('statusText').textContent = "TESTING";
            document.getElementById('mainVal').textContent = "...";
            document.getElementById('batVal').textContent = "...";
        }
      } catch(e){}
    }
  }
}

async function startScan() {
  const sn = document.getElementById('snInput').value.trim();
  if(!sn) return;
  
  const cmd = JSON.stringify({cmd: 'measure', serialNo: sn}) + "\n";
  await writer.write(new TextEncoder().encode(cmd));
  document.getElementById('scanBtn').disabled = true;
  document.getElementById('snInput').disabled = true;
}

function finalize(data) {
  const isDisconnected = (data.current_mA <= 1);
  const actualPct = isDisconnected ? 0 : data.batteryPct;
  const isPass = (actualPct >= 70 && !isDisconnected);
  
  const statusLabel = isDisconnected ? "DISCONNECTED" : (isPass ? "PASS" : "FAIL");
  
  // Update UI Elements
  const body = document.getElementById('body');
  document.getElementById('statusText').textContent = statusLabel;
  document.getElementById('mainVal').textContent = isDisconnected ? "0.0" : data.current_mA;
  document.getElementById('batVal').textContent = actualPct + "%";
  document.getElementById('topLabel').textContent = "SERIAL: " + data.serialNo;

  // Background Colors
  body.className = ""; 
  if(isPass) body.classList.add('status-pass');
  else body.classList.add('status-fail');

  const record = { ...data, batteryPct: actualPct, time: new Date().toLocaleTimeString(), statusLabel };
  history.unshift(record);
  updateUI();
  sync(record);

  // Auto-Reset after 3 seconds
  setTimeout(() => {
    resetUI();
  }, 3000);
}

function resetUI() {
  document.body.className = "";
  document.getElementById('statusText').textContent = "READY";
  document.getElementById('mainVal').textContent = "—";
  document.getElementById('batVal').textContent = "—";
  document.getElementById('topLabel').textContent = "Awaiting Device";
  document.getElementById('snInput').disabled = false;
  document.getElementById('scanBtn').disabled = false;
  document.getElementById('snInput').value = "";
  document.getElementById('snInput').focus();
}

function updateUI() {
  const tbody = document.getElementById('historyBody');
  tbody.innerHTML = history.map(r => `
    <tr>
      <td>${r.time}</td>
      <td>${r.serialNo}</td>
      <td><b>${r.batteryPct}%</b></td>
      <td>${r.current_mA} mA</td>
      <td><span class="tag ${r.statusLabel==='PASS'?'tag-pass':'tag-fail'}">${r.statusLabel}</span></td>
    </tr>
  `).join('');
  
  const total = history.length;
  const pass = history.filter(r => r.statusLabel === 'PASS').length;
  document.getElementById('sumTotal').textContent = total;
  document.getElementById('sumPass').textContent = pass;
  document.getElementById('sumFail').textContent = total - pass;
  document.getElementById('sumYield').textContent = total > 0 ? Math.round((pass/total)*100) + "%" : "0%";
}

async function sync(record) {
  if(!GOOGLE_SHEET_URL.startsWith("http")) return;
  fetch(GOOGLE_SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(record) });
}
</script>
</body>
</html>
